services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # client port
      - "8222:8222"   # monitoring
    restart: unless-stopped

  # Number of instances is set by INSTANCES (see .env)
  sensors-server:
    build:
      context: .
      dockerfile: warehouse-service/Dockerfile
    image: warehouse-service:latest
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SENSOR_IDS: ${SENSOR_IDS:-t1,h1}
      HUMIDITY_PORT: ${HUMIDITY_PORT:-3344}
      TEMPERATURE_PORT: ${TEMPERATURE_PORT:-3355}
      SHUTDOWN_TIMEOUT_SEC: ${SHUTDOWN_TIMEOUT_SEC:-5}
      PUBLISH_QUEUE_CAPACITY: ${PUBLISH_QUEUE_CAPACITY:-10000}
    depends_on:
      - nats
    expose:
      - "3344/udp"   # humidity sensor
      - "3355/udp"   # temperature sensor
    deploy:
      replicas: ${INSTANCES:-1}
    restart: unless-stopped
    stop_grace_period: 10s

  central-monitoring-service:
    build:
      context: .
      dockerfile: central-monitoring-service/Dockerfile
    image: central-monitoring-service:latest
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_SUBJECT: ${NATS_SUBJECT:-sensors.>}
      HTTP_PORT: ${HTTP_PORT:-8080}
      TEMPERATURE_LIMIT: ${TEMPERATURE_LIMIT:-35}
      HUMIDITY_LIMIT: ${HUMIDITY_LIMIT:-50}
    depends_on:
      - nats
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 10s

  # UDP gateway / round-robin load balancer: 3344 and 3355
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3344:3344/udp"
      - "3355:3355/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sensors-server
    restart: unless-stopped
