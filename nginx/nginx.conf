worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    # Docker's embedded DNS. "sensors-server" resolves to one A record per replica; with `resolve`
    # nginx re-resolves it periodically, so scaled/recreated instances are picked up without reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream humidity {
        zone humidity 64k;
        server sensors-server:3344 resolve;
    }

    upstream temperature {
        zone temperature 64k;
        server sensors-server:3355 resolve;
    }

    server {
        listen 3344 udp;
        proxy_pass humidity;
        proxy_responses 0;   # fire-and-forget: session ends after the datagram, so each datagram is balanced
    }

    server {
        listen 3355 udp;
        proxy_pass temperature;
        proxy_responses 0;
    }
}
